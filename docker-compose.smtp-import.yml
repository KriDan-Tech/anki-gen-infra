# Optional first-import overlay; the default compose flow remains unchanged.
# Compose long bind syntax with create_host_path:false fails if the protected export directory is absent.
# UNVERIFIED: this repository does not pin the Docker Compose CLI version; syntax follows the official service specification.
# https://docs.docker.com/reference/compose-file/services/
services:
  keycloak:
    volumes:
      - type: bind
        source: ${KEYCLOAK_IMPORT_DIRECTORY:?Set KEYCLOAK_IMPORT_DIRECTORY to the protected realm-export directory}
        target: /opt/keycloak/data/import
        read_only: true
        bind:
          create_host_path: false
