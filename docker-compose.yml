name: dev-anki-gen

# Этапы 1–6. Поднимает инфраструктуру (postgres, rabbitmq, mailpit), keycloak, api-gateway,
# source-service (Python) и Java-сервисы vocab-extractor / card-builder / deck-service.
# Основной вход — сервис proxy (80 → 301 на 443, 443): все адреса стенда на одном origin https://PUBLIC_HOST/.
# Прямые порты сервисов (3000, 8080, 8180, 8025, 1025, 5432, 5672, 15672) пока оставлены для стенда и закрываются перед продом (план, §6).
# Каждый сервис собирается из своего репозитория (полирепо): build.context: ./<репозиторий>.
# Каталоги ./<репозиторий> раскладывает Ansible (roles/app, список app_repos в roles/app/defaults/main.yml):
# новый сервис добавлять в оба места с одинаковым именем.

services:
  postgres:
    image: postgres:17
    container_name: anki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # передаются в init-скрипт 01-databases.sh (создание баз и пользователей сервисов)
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      SOURCE_DB_USER: ${SOURCE_DB_USER}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}
      EXTRACTOR_DB_USER: ${EXTRACTOR_DB_USER}
      EXTRACTOR_DB_PASSWORD: ${EXTRACTOR_DB_PASSWORD}
      BUILDER_DB_USER: ${BUILDER_DB_USER}
      BUILDER_DB_PASSWORD: ${BUILDER_DB_PASSWORD}
      DECK_DB_USER: ${DECK_DB_USER}
      DECK_DB_PASSWORD: ${DECK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      # -h 127.0.0.1: проверка по TCP. При первой инициализации entrypoint поднимает временный сервер
      # только на Unix-сокете (listen_addresses=''), и pg_isready без -h отмечал бы healthy раньше,
      # чем сервисы смогут подключиться к postgres:5432.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: anki-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Заглушка SMTP: ловит письма Keycloak (этап 6), наружу ничего не уходит. UI — через proxy: https://PUBLIC_HOST/mailpit/
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: anki-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"      # web UI (прямой доступ, до прода)
      - "1025:1025"      # SMTP
    environment:
      MP_MAX_MESSAGES: 500
      # путь UI за proxy; должен совпадать с location /mailpit/ в proxy/templates
      MP_WEBROOT: /mailpit/

  # Keycloak (этап 6): realm anki-gen импортируется из auth-keycloak/realm-export.json при старте.
  # Образ закреплён тегом. Адрес выдачи токенов (iss) задаёт KC_HOSTNAME — полный URL с /auth, его же ждёт gateway.
  # PUBLIC_HOST (infra/.env) — единственный адрес стенда (IP сервера или домен); браузер ходит на https://PUBLIC_HOST/auth/.
  keycloak:
    build:
      context: ./anki-gen-auth-keycloak
    container_name: anki-keycloak
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # полный URL с контекстным путём: схема, хост и /auth (документация Keycloak, Configuring the hostname)
      KC_HOSTNAME: https://${PUBLIC_HOST}/auth
      # контекстный путь Keycloak совпадает с путём в proxy (план §1.2)
      KC_HTTP_RELATIVE_PATH: /auth
      # за reverse proxy: заголовки X-Forwarded-* от proxy
      KC_PROXY_HEADERS: xforwarded
      # явно, на случай перехода на start (план §1.2)
      KC_HTTP_ENABLED: "true"
      # подставляется в realm-export.json (redirect URI и web origin клиента swagger)
      GATEWAY_PUBLIC_URL: https://${PUBLIC_HOST}
      # подставляется в realm-export.json (redirect URI, web origin и post logout клиента web)
      WEB_PUBLIC_URL: https://${PUBLIC_HOST}
      # подставляются в realm-export.json (провайдер Google); пустые — вход через Google не работает
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8180:8080"      # прямой доступ к Keycloak (стенд; до прода). Основной вход — через proxy, /auth/
    depends_on:
      postgres:
        condition: service_healthy
        # Postgres пересоздан (например, после down -v / смены volume) → перезапустить сервис,
        # иначе миграции (Flyway/alembic/Keycloak) не прогонятся на пустой базе
        restart: true
      mailpit:
        condition: service_started

  # Приём материала (Python, этап 3): PDF → блоки с разметкой. Файлы книг — в volume sources,
  # удаляются по build.completed.v1 (план §3, этап 3).
  source-service:
    build:
      context: ./anki-gen-source-service
    container_name: anki-source-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SOURCE_DB_NAME: source_db
      SOURCE_DB_USER: ${SOURCE_DB_USER}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      SOURCES_DIR: /data/sources
    volumes:
      - sources:/data/sources
    depends_on:
      postgres:
        condition: service_healthy
        # Postgres пересоздан (например, после down -v / смены volume) → перезапустить сервис,
        # иначе миграции (Flyway/alembic/Keycloak) не прогонятся на пустой базе
        restart: true
      rabbitmq:
        condition: service_healthy

  vocab-extractor:
    build:
      context: ./anki-gen-vocab-extractor
    container_name: anki-vocab-extractor
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      EXTRACTOR_DB_NAME: extractor_db
      EXTRACTOR_DB_USER: ${EXTRACTOR_DB_USER}
      EXTRACTOR_DB_PASSWORD: ${EXTRACTOR_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # ИИ-переменные задачи DETECT (этап 3)
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_DETECT_MODEL: ${AI_DETECT_MODEL}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT}
      AI_RESPONSE_FORMAT: ${AI_RESPONSE_FORMAT:-json_schema}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-}
      AI_MAX_PAGES_PER_EXTRACTION: ${AI_MAX_PAGES_PER_EXTRACTION:-200}
      # блоки книги и source.parsed.v1 (этап 3)
      SOURCE_SERVICE_URL: http://source-service:8081
    depends_on:
      postgres:
        condition: service_healthy
        # Postgres пересоздан (например, после down -v / смены volume) → перезапустить сервис,
        # иначе миграции (Flyway/alembic/Keycloak) не прогонятся на пустой базе
        restart: true
      rabbitmq:
        condition: service_healthy
      source-service:
        condition: service_started

  card-builder:
    build:
      context: ./anki-gen-card-builder
    container_name: anki-card-builder
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BUILDER_DB_NAME: builder_db
      BUILDER_DB_USER: ${BUILDER_DB_USER}
      BUILDER_DB_PASSWORD: ${BUILDER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # ИИ-переменные задачи TRANSLATE (этап 2)
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_TRANSLATE_MODEL: ${AI_TRANSLATE_MODEL}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT}
      AI_RESPONSE_FORMAT: ${AI_RESPONSE_FORMAT:-json_schema}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-}
      AI_MAX_WORDS_PER_BUILD: ${AI_MAX_WORDS_PER_BUILD:-2000}
      AI_TRANSLATE_CONTEXT: ${AI_TRANSLATE_CONTEXT:-true}
    depends_on:
      postgres:
        condition: service_healthy
        # Postgres пересоздан (например, после down -v / смены volume) → перезапустить сервис,
        # иначе миграции (Flyway/alembic/Keycloak) не прогонятся на пустой базе
        restart: true
      rabbitmq:
        condition: service_healthy

  deck-service:
    build:
      context: ./anki-gen-deck-service
    container_name: anki-deck-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DECK_DB_NAME: deck_db
      DECK_DB_USER: ${DECK_DB_USER}
      DECK_DB_PASSWORD: ${DECK_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # retranslate → card-builder /internal/translations/lookup (этап 2)
      CARD_BUILDER_URL: http://card-builder:8083
      # перед удалением колоды — проверка поиска слов в vocab-extractor (план Q2, вариант «в»)
      VOCAB_EXTRACTOR_URL: http://vocab-extractor:8082
      # готовые .apkg (этап 2)
      EXPORT_DIR: /data/exports
    volumes:
      - deck-exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
        # Postgres пересоздан (например, после down -v / смены volume) → перезапустить сервис,
        # иначе миграции (Flyway/alembic/Keycloak) не прогонятся на пустой базе
        restart: true
      rabbitmq:
        condition: service_healthy

  # Единая точка входа (этап 6): маршруты по префиксам, проверка JWT Keycloak, X-User-Id, Swagger UI.
  # Адреса сервисов — внутри сети compose; снаружи доступен только gateway.
  api-gateway:
    build:
      context: ./anki-gen-api-gateway
    container_name: anki-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SOURCE_SERVICE_URL: http://source-service:8081
      VOCAB_EXTRACTOR_URL: http://vocab-extractor:8082
      CARD_BUILDER_URL: http://card-builder:8083
      DECK_SERVICE_URL: http://deck-service:8084
      # JWKS — по внутреннему адресу (с контекстным путём /auth); iss — внешний адрес Keycloak через proxy (KC_HOSTNAME выше)
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/anki-gen/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: https://${PUBLIC_HOST}/auth/realms/anki-gen
      # адреса, которые открывает браузер (Swagger UI → Authorize)
      KEYCLOAK_AUTHORIZATION_URI: https://${PUBLIC_HOST}/auth/realms/anki-gen/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: https://${PUBLIC_HOST}/auth/realms/anki-gen/protocol/openid-connect/token
      SWAGGER_CLIENT_ID: swagger
      # за proxy: Spring берёт схему и хост из X-Forwarded-*, Swagger строит https-адреса (код gateway не меняется)
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_started
      source-service:
        condition: service_started
      vocab-extractor:
        condition: service_started
      card-builder:
        condition: service_started
      deck-service:
        condition: service_started

  # Веб-интерфейс (Angular): статика и nginx самого сервиса. Конфиг Keycloak отдаётся браузеру из /config.json
  # (nginx берёт значения из окружения ниже). Основной вход — через proxy; прямой порт 3000 оставлен до прода;
  # встроенный /api у этого сервиса не используется (proxy перехватывает /api/).
  web-frontend:
    build:
      context: ./anki-web-frontend
    container_name: anki-web-frontend
    restart: unless-stopped
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
      KEYCLOAK_URL: https://${PUBLIC_HOST}/auth
      KEYCLOAK_REALM: anki-gen
      KEYCLOAK_CLIENT_ID: web
      MAX_UPLOAD_SIZE: 100m
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started

  # Единая точка входа стенда: TLS на 443, 80 → 301 на https. Конфиг — proxy/templates/default.conf.template,
  # подстановка переменных делает штатный envsubst образа nginx. Сертификат — ./certs (выпускает Ansible).
  # Образ закреплён тегом, как у web-frontend.
  proxy:
    image: nginx:1.30.6-alpine
    container_name: anki-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # upstream внутри сети compose (http, TLS только на proxy)
      WEB_FRONTEND_URL: http://web-frontend:80
      API_GATEWAY_URL: http://api-gateway:8080
      KEYCLOAK_UPSTREAM: http://keycloak:8080
      MAILPIT_UPSTREAM: http://mailpit:8025
      MAX_UPLOAD_SIZE: 100m
      # подсеть админки (infra/.env); без неё compose падает с сообщением
      ADMIN_ALLOWED_CIDR: ${ADMIN_ALLOWED_CIDR:?задайте ADMIN_ALLOWED_CIDR в infra/.env, см. .env.example}
      # белый список всего стенда (infra/.env); all — без ограничения
      ALLOWED_CIDR: ${ALLOWED_CIDR:?задайте ALLOWED_CIDR в infra/.env, см. .env.example}
    volumes:
      - ./proxy/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      web-frontend:
        condition: service_started
      api-gateway:
        condition: service_started
      keycloak:
        condition: service_started
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  deck-exports:
  sources:
