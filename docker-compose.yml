name: dev-anki-gen

# Этап 1 — фундамент репозитория. Поднимает инфраструктуру (postgres, rabbitmq, mailpit)
# и три Java-сервиса-каркаса. gateway / auth-keycloak / source-service добавляются на своих этапах.
# Каждый сервис собирается из соседнего репозитория (полирепо): build.context: ../<сервис>.

services:
  postgres:
    image: postgres:17
    container_name: anki-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # передаются в init-скрипт 01-databases.sh (создание баз и пользователей сервисов)
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      SOURCE_DB_USER: ${SOURCE_DB_USER}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}
      EXTRACTOR_DB_USER: ${EXTRACTOR_DB_USER}
      EXTRACTOR_DB_PASSWORD: ${EXTRACTOR_DB_PASSWORD}
      BUILDER_DB_USER: ${BUILDER_DB_USER}
      BUILDER_DB_PASSWORD: ${BUILDER_DB_PASSWORD}
      DECK_DB_USER: ${DECK_DB_USER}
      DECK_DB_PASSWORD: ${DECK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: anki-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Заглушка SMTP: ловит письма Keycloak (этап 6), наружу ничего не уходит. UI на 8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: anki-mailpit
    ports:
      - "8025:8025"      # web UI
      - "1025:1025"      # SMTP
    environment:
      MP_MAX_MESSAGES: 500

  vocab-extractor:
    build:
      context: ../vocab-extractor
    container_name: anki-vocab-extractor
    environment:
      SERVER_PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      EXTRACTOR_DB_NAME: extractor_db
      EXTRACTOR_DB_USER: ${EXTRACTOR_DB_USER}
      EXTRACTOR_DB_PASSWORD: ${EXTRACTOR_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # ИИ-переменные нужны начиная с этапа 3 (задача DETECT); в каркасе этапа 1 не используются.
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_DETECT_MODEL: ${AI_DETECT_MODEL}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  card-builder:
    build:
      context: ../card-builder
    container_name: anki-card-builder
    environment:
      SERVER_PORT: 8083
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BUILDER_DB_NAME: builder_db
      BUILDER_DB_USER: ${BUILDER_DB_USER}
      BUILDER_DB_PASSWORD: ${BUILDER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # ИИ-переменные задачи TRANSLATE (этап 2)
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_TRANSLATE_MODEL: ${AI_TRANSLATE_MODEL}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  deck-service:
    build:
      context: ../deck-service
    container_name: anki-deck-service
    environment:
      SERVER_PORT: 8084
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DECK_DB_NAME: deck_db
      DECK_DB_USER: ${DECK_DB_USER}
      DECK_DB_PASSWORD: ${DECK_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # retranslate → card-builder /internal/translations/lookup (этап 2)
      CARD_BUILDER_URL: http://card-builder:8083
      # готовые .apkg (этап 2)
      EXPORT_DIR: /data/exports
    volumes:
      - deck-exports:/data/exports
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  deck-exports:
