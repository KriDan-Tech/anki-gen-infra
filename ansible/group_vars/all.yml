#Hardening
hardening_keys_dir: "{{ playbook_dir }}/files/keys"

# Подсеть, из которой разрешён SSH на все серверы.
hardening_admin_network: "192.168.0.0/24"

# Пользователи, которые должны существовать на каждом сервере.
hardening_users:
  - name: ansible
    comment: "Ansible automation"
    shell: /bin/bash
    sudo: true
    ssh_keys:
      - ansible.pub

  - name: danil
    comment: "Danil Krivobok, administrator"
    shell: /bin/bash
    sudo: true
    ssh_keys:
      - danil.pub

  - name: deploy
    comment: "Application deployment"
    shell: /bin/bash
    sudo: false
    ssh_keys:
      - deploy.pub

# Пользователи, которых на серверах быть не должно.
hardening_absent_users: []

docker_users:
  - deploy
