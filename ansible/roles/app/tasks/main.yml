- name: Prepare files
  ansible.builtin.import_tasks: preparation.yml
  tags: preparation

- name: Generate TLS certificate for proxy
  ansible.builtin.import_tasks: certs.yml
  tags: certs

- name: Start Docker compose
  ansible.builtin.import_tasks: docker.yml
  tags: docker

- name: "Let's Encrypt: выпуск и таймер продления"
  ansible.builtin.import_tasks: acme.yml
  tags: [certs, acme]
