
- name: Собрать образы и запустить стек
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    build: always
    state: present
    wait: true
    remove_orphans: true

# bind-mount конфига и сертификата compose не отслеживает: без рестарта proxy новые файлы не применятся
- name: Перезапустить proxy при смене конфига или сертификата
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    services:
      - proxy
    state: restarted
  # default({}): при запуске только --tags docker регистраций из preparation/certs нет
  when: (app_proxy_conf | default({})) is changed or (app_tls_active_crt | default({})) is changed or (app_tls_active_key | default({})) is changed
