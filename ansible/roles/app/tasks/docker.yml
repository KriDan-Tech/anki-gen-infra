
# UNVERIFIED: ansible-core/community.docker versions are not pinned; see notification API notes.
# Do not rerun the entire fresh-volume initializer against an existing cluster.
- name: Запустить только PostgreSQL перед targeted provisioning
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    services: [postgres]
    state: present
    wait: true

- name: Создать только notification DB и непривилегированную роль
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - postgres
      - bash
      - /opt/provision-notification-db.sh
    chdir: "{{ app_dir }}"
  no_log: true
  changed_when: false

- name: Собрать образы и запустить стек
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    build: always
    state: present
    wait: true
    remove_orphans: true

# bind-mount конфига и сертификата compose не отслеживает: без рестарта proxy новые файлы не применятся
- name: Перезапустить proxy при смене конфига или сертификата
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    services:
      - proxy
    state: restarted
  # default({}): при запуске только --tags docker регистраций из preparation/certs нет
  when: (app_proxy_conf | default({})) is changed or (app_tls_active_crt | default({})) is changed or (app_tls_active_key | default({})) is changed
