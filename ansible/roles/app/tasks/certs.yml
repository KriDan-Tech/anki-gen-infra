# модулям community.crypto нужна Python-библиотека cryptography на ноде
- name: Установить python3-cryptography
  ansible.builtin.apt:
    name: python3-cryptography
    state: present

- name: Прочитать PUBLIC_HOST из infra/.env
  ansible.builtin.set_fact:
    app_public_host: "{{ lookup('ansible.builtin.ini', 'PUBLIC_HOST', file=(playbook_dir | dirname) ~ '/.env', type='properties') }}"

# IPv4 или IPv6 → IP:, иначе DNS:; плюс localhost для локальной проверки
- name: Вычислить SAN сертификата
  ansible.builtin.set_fact:
    app_cert_san:
      - "{{ ('IP:' if (app_public_host is match('^[0-9.]+$') or ':' in app_public_host) else 'DNS:') ~ app_public_host }}"
      - "DNS:localhost"
      - "IP:127.0.0.1"

- name: Создать каталог сертификатов
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ app_cert_dir }}"
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"

# ECDSA P-256; ключ не меняется при смене PUBLIC_HOST, перевыпускается только сертификат
- name: Сгенерировать ключ TLS (ECDSA P-256)
  community.crypto.openssl_privatekey:
    path: "{{ app_dir }}/{{ app_cert_dir }}/tls.key"
    type: ECC
    curve: secp256r1
    mode: "0600"
    owner: deploy
    group: deploy
  register: app_key

- name: Сформировать CSR с SAN для TLS
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ app_dir }}/{{ app_cert_dir }}/tls.key"
    subject_alt_name: "{{ app_cert_san }}"
    extended_key_usage:
      - serverAuth
    basic_constraints:
      - "CA:FALSE"
  register: app_csr

# одиночный самоподписанный сертификат (решение владельца I); срок — предел Apple, 825 дней
- name: Выпустить самоподписанный сертификат
  community.crypto.x509_certificate:
    path: "{{ app_dir }}/{{ app_cert_dir }}/tls.crt"
    privatekey_path: "{{ app_dir }}/{{ app_cert_dir }}/tls.key"
    csr_content: "{{ app_csr.csr }}"
    provider: selfsigned
    selfsigned_not_after: "+{{ app_cert_days }}d"
    mode: "0644"
    owner: deploy
    group: deploy
  register: app_cert

# на контроллер забирается только tls.crt (для доверенных устройств владельца); tls.key остаётся на ноде
- name: Забрать tls.crt в infra/certs
  ansible.builtin.fetch:
    src: "{{ app_dir }}/{{ app_cert_dir }}/tls.crt"
    dest: "{{ playbook_dir | dirname }}/certs/{{ inventory_hostname }}.crt"
    flat: true
