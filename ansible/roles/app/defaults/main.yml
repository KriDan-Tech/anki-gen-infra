
app_dir: "/srv/myapp"
app_compose_file: "docker-compose.yml"
app_db_migrations_dir: "postgres"
app_proxy_dir: "proxy"
app_cert_dir: "certs"
app_cert_days: 825
app_cert_selfsigned_dir: "certs/selfsigned"
app_acme_dir: "acme"
app_acme_data_dir: "acme-data"
# 04:00 МСК = 01:00 UTC; таймзона в выражении, не зависит от TZ ноды (решение владельца 2026-10-28)
app_acme_timer_oncalendar: "*-*-* 01:00:00 UTC"

app_repos:
  - name: anki-gen-auth-keycloak
    url: git@github.com:KriDan-Tech/anki-gen-auth-keycloak.git
    version: main
  - name: anki-gen-api-gateway
    url: git@github.com:KriDan-Tech/anki-gen-api-gateway.git
    version: main
  - name: anki-gen-source-service
    url: git@github.com:KriDan-Tech/anki-gen-source-service.git
    version: main
  - name: anki-gen-deck-service
    url: git@github.com:KriDan-Tech/anki-gen-deck-service.git
    version: main
  - name: anki-web-frontend
    url: git@github.com:KriDan-Tech/anki-web-frontend.git
    version: main
  - name: anki-gen-card-builder
    url: git@github.com:KriDan-Tech/anki-gen-card-builder.git
    version: main
  - name: anki-gen-vocab-extractor
    url: git@github.com:KriDan-Tech/anki-gen-vocab-extractor.git
    version: main
