- name: Create users
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: true
    password_lock: true
    state: present
  loop: "{{ hardening_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set authorized SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: |
      {% for key_file in item.ssh_keys %}
      {{ lookup('ansible.builtin.file', hardening_keys_dir ~ '/' ~ key_file) }}
      {% endfor %}
    exclusive: true
    state: present
  loop: "{{ hardening_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Grant passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/hardening-{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ hardening_users | selectattr('sudo', 'defined') | selectattr('sudo') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Revoke sudo from users without it
  ansible.builtin.file:
    path: "/etc/sudoers.d/hardening-{{ item.name }}"
    state: absent
  loop: "{{ hardening_users | rejectattr('sudo', 'defined') | list + hardening_users | selectattr('sudo', 'defined') | rejectattr('sudo') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove users that must be absent
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ hardening_absent_users }}"

- name: Remove sudo rules of absent users
  ansible.builtin.file:
    path: "/etc/sudoers.d/hardening-{{ item }}"
    state: absent
  loop: "{{ hardening_absent_users }}"
