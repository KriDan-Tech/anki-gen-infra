- name: Ensure /etc/wireguard exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy wg0.conf
  ansible.builtin.template:
    src: templates/wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart wg0

- name: Enable and start wg0
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
