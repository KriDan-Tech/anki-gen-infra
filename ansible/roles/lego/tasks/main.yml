
- name: Create lego directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ lego_dir }}"
    - "{{ lego_dir }}/state"
    - "{{ lego_dir }}/secrets"

- name: Install Selectel password
  become: true
  ansible.builtin.copy:
    content: "{{ lego_selectel_password }}"
    dest: "{{ lego_dir }}/secrets/selectel-password"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Install lego Compose configuration
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ lego_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"

- name: Obtain TLS certificates with Lego
  become: true
  ansible.builtin.command:
    cmd: docker compose run --rm lego
    chdir: "{{ lego_dir }}"
  register: lego_result
  changed_when: lego_result.rc == 0

- name: Set certificates directory permissions
  become: true
  ansible.builtin.file:
    path: "{{ lego_dir }}/certificates"
    owner: root
    group: "{{ lego_cert_owner_group_gid }}"
    mode: "0750"

- name: Set certificate files permissions
  become: true
  ansible.builtin.file:
    path: "{{ lego_dir }}/certificates/{{ item }}"
    owner: root
    group: "{{ lego_cert_owner_group_gid }}"
    mode: "0640"
  loop:
    - "{{ lego_domain }}.crt"
    - "{{ lego_domain }}.key"
