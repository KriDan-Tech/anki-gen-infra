- name: Загрузить настройки бэкапа для хоста
  ansible.builtin.include_vars:
    file: "hosts/{{ inventory_hostname }}.yml"

- name: Проверить, что пароль архива загружен
  ansible.builtin.assert:
    that:
      - (backup_archive_secret | default('') | length) > 0
    fail_msg: "Переменная archive_secret отсутствует или пуста."
    quiet: true

- name: Создать каталог для пароля архива
  become: true
  ansible.builtin.file:
    path: "{{ backup_archive_password_file | dirname }}"
    state: directory
    owner: "{{ backup_run_user }}"
    mode: "0700"

- name: Установить пароль для шифрования архивов
  become: true
  ansible.builtin.copy:
    content: "{{ backup_archive_secret }}"
    dest: "{{ backup_archive_password_file }}"
    owner: "{{ backup_run_user }}"
    mode: "0600"
  no_log: true
  diff: false

- name: Проверить расписание бэкапа
  ansible.builtin.assert:
    that:
      - >-
        (volume_backup_schedule_unit == 'hours' and
         (volume_backup_schedule_every | string) in ['1', '2', '3', '4', '6', '8', '12', '24'])
        or
        (volume_backup_schedule_unit == 'days' and
         (volume_backup_schedule_every | string) in ['1', '2', '3', '4', '5', '6', '7'])
    fail_msg: "Укажи hours с интервалом 1, 2, 3, 4, 6, 8, 12 или 24 либо days с интервалом от 1 до 7."

- name: Создать каталог для лога
  become: true
  ansible.builtin.file:
    path: "{{ backup_log_file | dirname }}"
    state: directory
    owner: "{{ backup_run_user }}"
    mode: "0750"
  when: (backup_log_file | default('') | length) > 0

- name: Установить скрипт бэкапа Docker-томов
  become: true
  ansible.builtin.template:
    src: docker-volume-backup.sh.j2
    dest: /usr/local/bin/backup-docker-volumes.sh
    owner: "{{ backup_run_user }}"
    mode: "0700"
    validate: "/bin/bash -n %s"

- name: Настроить cron для бэкапа Docker-томов
  become: true
  ansible.builtin.cron:
    name: "Бэкап Docker-томов"
    user: "{{ backup_run_user }}"
    minute: "0"
    hour: >-
      {{ '*/' ~ (volume_backup_schedule_every | int)
         if volume_backup_schedule_unit == 'hours' and (volume_backup_schedule_every | int) < 24
         else '0' }}
    job: >-
      {% if volume_backup_schedule_unit == 'days' %}
      seconds=$(date -u -d "$(date -I)" +\%s) &&
      if [ "$((seconds / 86400 % {{ volume_backup_schedule_every | int }}))" -eq 0 ]; then
      /usr/local/bin/backup-docker-volumes.sh;
      fi
      {% else %}
      /usr/local/bin/backup-docker-volumes.sh
      {% endif %}
